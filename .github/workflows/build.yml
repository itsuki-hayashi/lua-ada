name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        library: [static, relocatable]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          # Scoped matrix evidence must name the published implementation head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: alire-project/setup-alire@v6
      - name: Record tools
        shell: pwsh
        run: |
          alr --version
          ./scripts/select-stable-toolchain.ps1
          alr -n toolchain
          alr exec -- gcc --version
          alr exec -- gcc -dumpmachine
          alr exec -- gprbuild --version
      - name: Instrumented runtime and adapter regressions
        shell: pwsh
        run: ./scripts/check-instrumented.ps1 -LibraryType '${{ matrix.library }}'
      - name: Windows instrumented static-PIC regressions
        if: matrix.os == 'windows-latest' && matrix.library == 'static'
        shell: pwsh
        run: ./scripts/check-instrumented.ps1 -LibraryType static-pic
      - name: Preserve instrumented observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: instrumented-${{ runner.os }}-${{ matrix.library }}
          path: |
            reports/instrumented/**
            reports/windows-buffered-failure/**
            reports/posix-files/**
            reports/managed-telemetry/**
            reports/launcher-selftest/**
            reports/core-image/**
            reports/gc-events/**
            reports/expanded-conformance/**
            reports/scoped-files/**
            reports/conformance/**/*.json
            reports/conformance/**/*.stdout
            reports/conformance/**/*.stderr
            reports/conformance/**/equivalent-*.lua
          if-no-files-found: error
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        library: [static, relocatable]
        profile: [development, validation, release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          # Keep all 26 contexts on the same reviewable source revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: alire-project/setup-alire@v6
      - name: Record tools
        shell: pwsh
        run: |
          alr --version
          ./scripts/select-stable-toolchain.ps1
          alr -n toolchain
          [Runtime.InteropServices.RuntimeInformation]::OSDescription
          [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          alr exec -- gcc --version
          alr exec -- gcc -dumpmachine
          alr exec -- gprbuild --version
      - name: Build and exercise consumers
        shell: pwsh
        run: |
          ./scripts/check.ps1 -LibraryType '${{ matrix.library }}' -Profile '${{ matrix.profile }}'
      - name: Conformance inventory and harness regressions
        shell: pwsh
        run: |
          ./scripts/check-conformance-inventory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-inventory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-conformance-scope.ps1
          ./scripts/test-conformance-scope.ps1
          ./scripts/test-expanded-conformance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-expanded-matrix-bundle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-matrix.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-runner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reference fixtures and ABI experiments
        if: matrix.library == 'static' && matrix.profile == 'validation'
        shell: pwsh
        run: |
          ./scripts/check-abi.ps1
          alr exec -- pwsh -NoProfile -File scripts/check-frontend.ps1
          ./scripts/check-layout.ps1 -AdaProbe "$PWD/tests/bin/static/lua-codec_layout_probe${{ runner.os == 'Windows' && '.exe' || '' }}"
          ./scripts/compare-libraries.ps1 -Interpreter "$PWD/cli/bin/static/lua_ada${{ runner.os == 'Windows' && '.exe' || '' }}"
          ./scripts/compare-lifecycle.ps1 -Interpreter "$PWD/cli/bin/static/lua_ada${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Install Linux C oracle readline prerequisite
        if: matrix.os == 'ubuntu-latest' && matrix.library == 'static' && matrix.profile == 'validation'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreadline-dev
      - name: Isolated C conformance baselines
        if: matrix.library == 'static' && matrix.profile == 'validation'
        timeout-minutes: 160
        shell: pwsh
        run: |
          foreach ($configuration in @('default', 'upstream-test')) {
            ./scripts/run-conformance.ps1 -Configuration $configuration -Mode Smoke -BuildReference
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./scripts/test-conformance-runner.ps1 -ReferenceInterpreter "$PWD/build/conformance/$configuration/bin/lua${{ runner.os == 'Windows' && '.exe' || '' }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Collect native upstream failures/skips without calling them passes.
            # Setup/capture failures remain failures even in report-only mode.
            ./scripts/run-conformance.ps1 -Configuration $configuration -Mode Aggregate -ReportOnly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./scripts/run-conformance.ps1 -Configuration $configuration -Mode Heavy -ReportOnly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preserve raw conformance observations
        if: always() && matrix.library == 'static' && matrix.profile == 'validation'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: conformance-${{ runner.os }}
          path: |
            reports/conformance/**/report.json
            reports/conformance/**/*.stdout
            reports/conformance/**/*.stderr
            reports/conformance/**/equivalent-*.lua
          if-no-files-found: error
      - name: Windows static-PIC acceptance
        if: matrix.os == 'windows-latest' && matrix.library == 'static' && matrix.profile == 'validation'
        shell: pwsh
        run: |
          ./scripts/check.ps1 -LibraryType static-pic -Profile validation
      - name: Preserve lifecycle observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lifecycle-${{ runner.os }}-${{ matrix.profile }}-${{ matrix.library }}
          path: |
            reports/lifecycle/**
            reports/m3-lifecycle-campaign*
            reports/managed-telemetry/**
            reports/launcher-selftest/**
            reports/windows-buffered-failure/**
            LICENSE
            reports/posix-files/**
            reports/gc-events/**
            reports/expanded-conformance/**
            reports/scoped-files/**
            reports/conformance/**/*.json
            reports/conformance/**/*.stdout
            reports/conformance/**/*.stderr
            reports/conformance/**/equivalent-*.lua
            docs/licenses/lua.md
          if-no-files-found: warn
      - name: Preserve core-image observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-image-${{ runner.os }}-${{ matrix.profile }}-${{ matrix.library }}
          path: reports/core-image/**
          if-no-files-found: warn
