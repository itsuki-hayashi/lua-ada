name: Build and full target observations

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      development_observations:
        description: Collect diagnostic source proposals without claiming acceptance
        required: false
        type: boolean
        default: false
      execution_policy:
        description: Repository relative reviewed transform selections (optional for diagnostics)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      execution_matrix: ${{ steps.plan.outputs.execution_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: plan
        shell: pwsh
        run: ./scripts/plan-target-workflow.ps1 -GitHubOutput

  context:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: alire-project/setup-alire@v6
      - name: Select stable native toolchain
        shell: pwsh
        run: |
          alr --version
          ./scripts/select-stable-toolchain.ps1
          alr -n toolchain
          alr exec -- gcc --version
          alr exec -- gcc -dumpmachine
          alr exec -- gprbuild --version
      - name: Install Linux C oracle readline prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreadline-dev
      - name: Retained ABI frontend and native layout gates
        if: matrix.configuration == 'default' && matrix.profile == 'validation' && matrix.library_type == 'static'
        shell: pwsh
        run: |
          ./scripts/check-abi.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          alr exec -- pwsh -NoProfile -File scripts/check-frontend.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build one context and retain actual named regressions
        shell: pwsh
        run: |
          $development = '${{ github.event_name == 'workflow_dispatch' && inputs.development_observations }}' -ceq 'true'
          ./scripts/build-target-context.ps1 -Context '${{ matrix.context }}' -DevelopmentObservation:$development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native layout and retained differential gates
        if: matrix.configuration == 'default' && matrix.profile == 'validation' && matrix.library_type == 'static'
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          ./scripts/check-layout.ps1 -AdaProbe "$PWD/tests/bin/static/lua-codec_layout_probe$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/compare-libraries.ps1 -Interpreter "$PWD/cli/bin/static/lua_ada$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/compare-lifecycle.ps1 -Interpreter "$PWD/cli/bin/static/lua_ada$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory and evidence validator regressions
        shell: pwsh
        run: |
          ./scripts/check-conformance-inventory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-inventory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-conformance-scope.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-scope.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-expanded-conformance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-expanded-matrix-bundle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-scoped-warning-evidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-matrix.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-runner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-conformance-runner.ps1 -ReferenceInterpreter "$PWD/build/conformance/${{ matrix.configuration }}/bin/lua${{ runner.os == 'Windows' && '.exe' || '' }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve immutable context image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: target-image-${{ matrix.id }}
          path: reports/target-images/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve context diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: target-build-diagnostics-${{ matrix.id }}
          path: |
            reports/target-builds/${{ matrix.id }}/**
            reports/core-image/**
            reports/instrumented/**
            reports/windows-buffered-failure/**
            reports/posix-files/**
            reports/managed-telemetry/**
            reports/launcher-selftest/**
            reports/lifecycle/**
            reports/m3-lifecycle-campaign*
            reports/native-layout.txt
          if-no-files-found: warn
          retention-days: 30

  execute:
    needs: [plan, context]
    if: always() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.execution_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: alire-project/setup-alire@v6
      - name: Select native fixture compiler
        shell: pwsh
        run: ./scripts/select-stable-toolchain.ps1
      - name: Install Linux native prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreadline-dev
      - uses: actions/download-artifact@v8
        with:
          name: target-image-${{ matrix.id }}
          path: reports/immutable-input/${{ matrix.id }}
      - name: Execute exact context image without rebuilding the runtime
        shell: pwsh
        env:
          TARGET_EXECUTION_POLICY: ${{ inputs.execution_policy || '' }}
        run: |
          $development = '${{ github.event_name == 'workflow_dispatch' && inputs.development_observations }}' -ceq 'true'
          ./scripts/run-target-partition.ps1 -Context '${{ matrix.context }}' -Partition '${{ matrix.partition }}' -ImageDirectory "$PWD/reports/immutable-input/${{ matrix.id }}" -ExecutionPolicy $env:TARGET_EXECUTION_POLICY -DevelopmentObservation:$development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve complete raw observation subtree
        if: always()
        shell: pwsh
        run: |
          $destination = "$PWD/reports/target-upload/${{ matrix.id }}-${{ matrix.partition }}/reports"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          if (Test-Path -LiteralPath reports/conformance) {
            Copy-Item -LiteralPath reports/conformance -Destination "$destination/conformance" -Recurse
          }
          $source = "$PWD/reports/target-partitions/${{ matrix.id }}/${{ matrix.partition }}"
          if (Test-Path -LiteralPath $source) {
            $parent = "$destination/target-partitions/${{ matrix.id }}"
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination "$parent/${{ matrix.partition }}" -Recurse
          }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: target-observations-${{ matrix.id }}-${{ matrix.partition }}
          path: reports/target-upload/${{ matrix.id }}-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: [plan, context, execute]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          pattern: target-image-*
          path: reports/downloaded-target
      - uses: actions/download-artifact@v8
        with:
          pattern: target-observations-*
          path: reports/downloaded-target
      - name: Reconcile complete observation collection
        shell: pwsh
        run: |
          ./scripts/collect-target-observations.ps1 -ArtifactDirectory "$PWD/reports/downloaded-target" -OutputDirectory "$PWD/reports/full-target-observations"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Captured observations only. Independent source, contract, native applicability, global API and post-observation envelope review remain separate acceptance gates.'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full-target-observation-bundle
          path: reports/full-target-observations
          if-no-files-found: error
          retention-days: 30
